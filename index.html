<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css">
  
  <title>Frontend Mentor | Stats preview card component</title>
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<!-- body -->
<body 
class="bg-[hsl(233,47%,7%)]">
<!-- main -->
<main class="bg-[hsl(244,37%,16%)] mt-32 w-full">

  <!-- main div -->
   <div class="flex flex-col md:flex-row-reverse">
  
    <!-- Left side (text) -->

  <div class="md:w-1/2 w-full relative">
    <img src="./images/image-header-desktop.jpg" alt="Business meeting" class="w-full h-full object-cover">
    <div class="absolute inset-0 bg-purple-700 opacity-50"></div>
  </div>

<!-- right side -->
  <div class="md:w-1/2 w-full bg-gray-900 flex flex-col justify-center p-10 text-white">
    <h1 class="text-3xl md:text-5xl font-bold mb-6">
      Get <span class="text-[hsl(277,64%,61%)]">insights</span> that help your business grow.
    </h1>
    <p class="text-lg md:text-xl mb-8 text-purple-200">
      Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.
    </p>

    <div class="md:w-1/2 text-white rounded-lg shadow-lg p-10 flex flex-col md:flex-row gap-10 space-y-6">
      <div class="text-center">
        <h3 class="text-3xl font-bold">10K+</h3>
        <p class="uppercase tracking-wide text-sm">Companies</p>
      </div>
      <div class="text-center">
        <h3 class="text-3xl font-bold">314</h3>
        <p class="uppercase tracking-wide text-sm">Templates</p>
      </div>
      <div class="text-center">
        <h3 class="text-3xl font-bold">12M+</h3>
        <p class="uppercase tracking-wide text-sm">Queries</p>
      </div>

    </div>
  </div>
</div>
</main>
</body>
</html>
